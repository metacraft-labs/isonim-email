<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Arabic in the capture environment. The pinned noto-fonts set carries
  several faces that cover Arabic; with no preference fontconfig ranks
  Noto Nastaliq Urdu first for `sans-serif:lang=ar` and for characters
  no listed family has, so every Arabic story rendered in a calligraphic
  Urdu face (tall descenders that leave their line box, joins WebKit
  draws wrong). Nastaliq is the wrong default for Arabic text: it is
  removed from the set, and Noto Sans Arabic UI is preferred for Arabic,
  the face a sans-serif stack is meant to fall back to. Not plain Noto
  Sans Arabic: Playwright's WebKit and WebKitGTK draw a word-final yeh
  in it without its two dots, regular and bold, and draw it right in
  the UI cut (Chromium and Gecko are right with both).
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*/NotoNastaliq*</glob>
    </rejectfont>
  </selectfont>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Arabic UI</string>
    </edit>
  </match>
  <alias>
    <family>sans-serif</family>
    <default>
      <family>Noto Sans Arabic UI</family>
    </default>
  </alias>
</fontconfig>
