<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Monospace in the capture environment. The font stack of code
  (`Menlo, Consolas, 'Courier New', monospace`) names faces no Linux
  host carries, and the pinned set has no conf.d to alias them, so
  browsers drew code in the proportional default. A desktop maps
  Courier New to its metric-compatible Liberation Mono (fontconfig's
  30-metric-aliases.conf) and `monospace` to a monospace face; this does
  the same, with the pinned Liberation Mono.
-->
<fontconfig>
  <alias binding="same">
    <family>Courier New</family>
    <accept>
      <family>Liberation Mono</family>
    </accept>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Liberation Mono</family>
    </prefer>
  </alias>
</fontconfig>
